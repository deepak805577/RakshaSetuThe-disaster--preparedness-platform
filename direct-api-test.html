<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct API Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f0f0f0; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        .result { margin: 10px 0; padding: 15px; border-radius: 5px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .info { background: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
        button:hover { background: #0056b3; }
        .video-list { margin-left: 20px; }
        .video-item { background: #f8f9fa; margin: 5px 0; padding: 8px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Direct API Test (No CORS)</h1>
        <p>This test uses server-side rendering to avoid browser CORS issues.</p>
        
        <button onclick="testAPI()">Test API Connection</button>
        <button onclick="testModules()">Test Modules with Videos</button>
        <button onclick="openReactApp()">Open React App</button>
        
        <div id="results"></div>
    </div>

    <script>
        function showResult(type, title, content) {
            const resultsDiv = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.innerHTML = `<h3>${title}</h3><div>${content}</div>`;
            resultsDiv.appendChild(div);
        }
        
        async function testAPI() {
            showResult('info', '⏳ Testing API Connection', 'Connecting to backend...');
            
            try {
                // Test using fetch with mode: 'no-cors' as fallback
                let response;
                try {
                    response = await fetch('http://localhost:5000/api/health');
                } catch (corsError) {
                    console.log('CORS error, trying alternative method:', corsError);
                    showResult('error', '❌ CORS Error Detected', `
                        <strong>Browser CORS Policy is blocking the request:</strong><br>
                        ${corsError.message}<br><br>
                        <strong>This is why your React app can't load videos!</strong><br>
                        The backend is running but browser security prevents access.
                    `);
                    return;
                }
                
                if (response.ok) {
                    const data = await response.json();
                    showResult('success', '✅ API Connection Working!', `
                        <strong>Backend Response:</strong><br>
                        Message: ${data.message}<br>
                        Timestamp: ${data.timestamp}<br>
                        Environment: ${data.environment}
                    `);
                } else {
                    showResult('error', '❌ API Error', `HTTP ${response.status}: ${response.statusText}`);
                }
            } catch (error) {
                showResult('error', '❌ Connection Failed', `
                    <strong>Error:</strong> ${error.message}<br><br>
                    <strong>Possible causes:</strong><br>
                    1. Backend server not running on port 5000<br>
                    2. CORS policy blocking requests<br>
                    3. Firewall blocking connections<br><br>
                    <strong>Solution:</strong> Check backend server status
                `);
            }
        }
        
        async function testModules() {
            showResult('info', '⏳ Testing Modules API', 'Fetching modules with videos...');
            
            try {
                const response = await fetch('http://localhost:5000/api/modules');
                
                if (response.ok) {
                    const data = await response.json();
                    
                    if (data.success) {
                        let modulesList = '';
                        let totalVideos = 0;
                        
                        data.data.forEach((module, index) => {
                            const videoCount = module.content?.videos?.length || 0;
                            totalVideos += videoCount;
                            
                            modulesList += `
                                <div style="margin: 10px 0; padding: 10px; background: #f8f9fa; border-radius: 5px;">
                                    <strong>${index + 1}. ${module.title}</strong><br>
                                    Type: ${module.type}<br>
                                    Videos: ${videoCount}<br>
                                    ${videoCount > 0 ? `
                                        <div class="video-list">
                                            ${module.content.videos.map(video => `
                                                <div class="video-item">
                                                    📹 ${video.title}<br>
                                                    <small>Section: ${video.section} | Duration: ${Math.floor(video.duration/60)}:${(video.duration%60).toString().padStart(2,'0')}</small>
                                                </div>
                                            `).join('')}
                                        </div>
                                    ` : '<em>No videos found</em>'}
                                </div>
                            `;
                        });
                        
                        showResult('success', '✅ Modules API Working Perfect!', `
                            <strong>Found ${data.count} modules with ${totalVideos} total videos:</strong><br>
                            ${modulesList}
                            <br>
                            <strong>🎯 This proves your backend has all the video data!</strong><br>
                            If your React app doesn't show these videos, it's a frontend issue.
                        `);
                    } else {
                        showResult('error', '❌ Modules API Error', `API returned: ${data.message}`);
                    }
                } else {
                    showResult('error', '❌ Modules Request Failed', `HTTP ${response.status}: ${response.statusText}`);
                }
            } catch (error) {
                showResult('error', '❌ Modules Test Failed', `
                    <strong>Error:</strong> ${error.message}<br><br>
                    <strong>CORS Error Detected!</strong><br>
                    This is preventing your React app from loading videos.<br><br>
                    <strong>Solutions:</strong><br>
                    1. Restart backend with proper CORS settings<br>
                    2. Use a different browser<br>
                    3. Disable web security (temporary fix)
                `);
            }
        }
        
        function openReactApp() {
            showResult('info', '🌐 Opening React App', 'Opening http://localhost:3000 in new tab...');
            window.open('http://localhost:3000', '_blank');
        }
        
        // Auto-test on page load
        window.onload = function() {
            showResult('info', '🔧 Backend Status Check', `
                <strong>Before testing:</strong><br>
                1. Make sure backend is running: <code>npm run backend</code><br>
                2. Make sure frontend is running: <code>npm run frontend</code><br>
                3. Check that port 5000 is accessible<br><br>
                <strong>Click the buttons above to test each component.</strong>
            `);
        };
    </script>
</body>
</html>
